name: 通知私有仓库部署到服务器

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 跨仓库调用只使用专用的 DEPLOY_TRIGGER_TOKEN。
permissions: {}

jobs:
  trigger-deployment:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger csguide-hope production deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Missing repository secret DEPLOY_TRIGGER_TOKEN (csguide-hope Actions: Read and write)."
            exit 1
          fi

          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            repos/iimarvinle/csguide-hope/actions/workflows/depoly.yml/dispatches \
            -f ref=main
